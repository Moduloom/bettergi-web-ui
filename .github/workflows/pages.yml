name: Publish demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - '.gitmodules'
      - 'frame.config.ts'
      - 'moduloom'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'src/**'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        id: pages
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the preview workbench
        env:
          BETTERGI_PREVIEW_BASE: '${{ steps.pages.outputs.base_path }}/'
          VITE_BETTERGI_STATIC_PREVIEW: 'true'
        run: |
          pnpm --dir moduloom build
          pnpm exec tsx --conditions=loom-source moduloom/frame/src/cli.ts build frame.config.ts
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/bettergi-ui

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
